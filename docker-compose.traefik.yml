# Overlay for the server: route the gateway (game clients) and the tracker (dashboard) through an existing Traefik.
# Game server: wss://${SESSION_ID}.${BASE_DOMAIN}:443  (players enter "${SESSION_ID}.${BASE_DOMAIN}:443" in their client)
# Dashboard:   https://${BASE_DOMAIN}
services:
  # MultiServer itself stays inside: game clients come in through the gateway
  gateway:
    networks: [default, traefik]
    environment:
      # Game clients connect to <session-id>.<BASE_DOMAIN>
      BASE_DOMAIN: ${BASE_DOMAIN:-randogeddon.eratiem.net}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.randogeddon-ap.rule: Host(`${SESSION_ID:?set SESSION_ID in .env}.${BASE_DOMAIN:-randogeddon.eratiem.net}`)
      traefik.http.routers.randogeddon-ap.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.randogeddon-ap.tls: "true"
      traefik.http.routers.randogeddon-ap.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.randogeddon-ap.loadbalancer.server.port: "38281"

  tracker:
    networks: [default, traefik]
    environment:
      # Shown to a session's players with their slot passwords ({id}: the session)
      PUBLIC_ADDRESS: "{id}.${BASE_DOMAIN:-randogeddon.eratiem.net}:443"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.randogeddon-tracker.rule: Host(`${BASE_DOMAIN:-randogeddon.eratiem.net}`)
      traefik.http.routers.randogeddon-tracker.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.randogeddon-tracker.tls: "true"
      traefik.http.routers.randogeddon-tracker.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.randogeddon-tracker.loadbalancer.server.port: "8000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
