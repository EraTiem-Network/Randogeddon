# Overlay for the server: route the gateway (game clients) and the tracker (dashboard) through an existing Traefik.
# Game servers: wss://<session-id>.${BASE_DOMAIN}:443  (players enter "<session-id>.${BASE_DOMAIN}:443" in their client)
# Dashboard:    https://${BASE_DOMAIN}
# One router for every session: the gateway relays each client by its host name to that session's MultiServer. Its
# wildcard certificate needs a cert resolver with the DNS challenge (TRAEFIK_DNS_CERTRESOLVER, see README).
services:
  # MultiServer itself stays inside: game clients come in through the gateway
  gateway:
    networks: [default, traefik]
    environment:
      # Game clients connect to <session-id>.<BASE_DOMAIN>
      BASE_DOMAIN: ${BASE_DOMAIN:-randogeddon.eratiem.net}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      # Every <session-id>.<BASE_DOMAIN> (Traefik v3 syntax; $$ is a $ for compose). The gateway checks the ID itself.
      traefik.http.routers.randogeddon-ap.rule: HostRegexp(`^[a-z0-9-]+\.${BASE_DOMAIN:-randogeddon.eratiem.net}$$`)
      traefik.http.routers.randogeddon-ap.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.randogeddon-ap.tls: "true"
      traefik.http.routers.randogeddon-ap.tls.certresolver: ${TRAEFIK_DNS_CERTRESOLVER:-letsencrypt-dns}
      traefik.http.routers.randogeddon-ap.tls.domains[0].main: "*.${BASE_DOMAIN:-randogeddon.eratiem.net}"
      traefik.http.services.randogeddon-ap.loadbalancer.server.port: "38281"
      # How fast one address (an IPv6 /64 as one) opens new connections to the game servers: 100 at once, then 2 a
      # second, 429 past it. Not how many it holds (behind a shared address are many households)
      traefik.http.routers.randogeddon-ap.middlewares: randogeddon-ap-rate
      traefik.http.middlewares.randogeddon-ap-rate.ratelimit.average: "2"
      traefik.http.middlewares.randogeddon-ap-rate.ratelimit.burst: "100"
      traefik.http.middlewares.randogeddon-ap-rate.ratelimit.sourcecriterion.ipstrategy.ipv6subnet: "64"

  tracker:
    networks: [default, traefik]
    environment:
      # Shown to a session's players with their slot passwords ({id}: the session)
      PUBLIC_ADDRESS: "{id}.${BASE_DOMAIN:-randogeddon.eratiem.net}:443"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.randogeddon-tracker.rule: Host(`${BASE_DOMAIN:-randogeddon.eratiem.net}`)
      traefik.http.routers.randogeddon-tracker.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.randogeddon-tracker.tls: "true"
      traefik.http.routers.randogeddon-tracker.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.randogeddon-tracker.loadbalancer.server.port: "8000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
