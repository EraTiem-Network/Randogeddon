gateway:
  # Port game clients connect to (behind Traefik: <session-id>.<BASE_DOMAIN>:443; without: ws://host:38281/<session-id>)
  port: "$PORT:38281"
  # The domain under which each session has its host name; empty: sessions are named by the path only
  baseDomain: "$BASE_DOMAIN:"
  internal:
    # The tracker controls the game servers here; never published or routed by Traefik
    port: "$INTERNAL_PORT:8001"
    # Shared with the tracker; without it the internal API refuses every call
    token: "$INTERNAL_TOKEN:"
  gameServer:
    # The Archipelago releases, one directory each (e.g. /opt/archipelago/0.6.8) with serve.py, room_info.py and
    # list_games.py
    apRoot: "$AP_ROOT:/opt/archipelago"
    python: "$PYTHON:python"
    # The sessions (sessions/<id>/: seed, save, room.json), deleted ones (old/), and the apworlds uploaded in the admin
    # panel (apworlds/<release>/)
    dataDir: "$DATA_DIR:/data"
    # Apworlds put on the server by hand; every release gets them
    customWorlds: "$CUSTOM_WORLDS:/custom_worlds"
    adminPassword: "$AP_ADMIN_PASSWORD:"
    # How long a generation may take before it is stopped (a big multiworld fills on one core for a long time)
    generationMinutes: "$GENERATION_MINUTES:60"
    generationsAtOnce: "$GENERATIONS_AT_ONCE:0"
  database:
    # PostgreSQL: the slot passwords (created by the tracker)
    url: "$DB_URL:jdbc:postgresql://localhost:5432/randogeddon"
    user: "$DB_USER:randogeddon"
    password: "$DB_PASSWORD:"
