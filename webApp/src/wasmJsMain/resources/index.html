<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Randogeddon</title>
  <meta name="description" content="Live tracker for our Archipelago multiworld session">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f5f4fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
  <!-- iOS: "Add to Home Screen" opens it full screen with its own icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Randogeddon">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root { --bg: #f5f4fa; --panel: #ffffff; --border: #e7e4f0; --text: #1b1a2b; --muted: #6c6a80; --accent: #7c5cff;
      --error: #d92d20; }
    @media (prefers-color-scheme: dark) { :root { --bg: #07070c; --panel: #101118; --border: #22232f; --text: #e9e8f2;
      --muted: #8d8ba3; --accent: #8e72ff; --error: #f97066; } }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: var(--muted); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
    #splash .ring { width: 44px; height: 44px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash b { color: var(--text); }
    /* Compose's own container: it attaches a shadow root there, which would hide everything else if it were <body> */
    #app { position: fixed; inset: 0; }
    /* The login: a real form (not Compose's canvas), so password managers can save and fill the generated password */
    #login { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--bg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #login[hidden] { display: none; }
    #login form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; padding: 24px;
      border-radius: 20px; background: var(--panel); border: 1px solid var(--border); color: var(--text); }
    #login h1 { margin: 0 0 4px; font-size: 22px; }
    #login label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12.5px; }
    #login input, #login select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 11px; }
    #login input:focus, #login select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    #login form[hidden] { display: none; }
    #login .hint { margin: 0; color: var(--muted); font-size: 12.5px; }
    #login button.secondary { color: var(--text); background: var(--bg); border: 1px solid var(--border); }
    #login button { font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 10px; padding: 10px;
      background: linear-gradient(90deg, #ff7a45, var(--accent)); cursor: pointer; }
    #login button:disabled { opacity: 0.6; cursor: default; }
    #login .message { margin: 0; color: var(--error); min-height: 1.4em; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="ring"></div>
    <div><b>Randogeddon</b><br>loading…</div>
    <noscript>This page needs JavaScript.</noscript>
  </div>
  <div id="app"></div>
  <div id="login" hidden>
    <form id="login-form">
      <h1>Randogeddon</h1>
      <label>Name or e-mail<input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="message" role="alert"></p>
      <button type="submit">Log in</button>
    </form>
    <!-- The invitation's link (#/invite/<token>): the new user chooses their name, password and deletion period -->
    <form id="signup-form" hidden>
      <h1>Welcome to Randogeddon</h1>
      <p class="hint"></p>
      <!-- For the password manager: the account's address, entered by the admin -->
      <input name="email" type="email" autocomplete="email" hidden>
      <label>Name<input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required
        minlength="3" maxlength="32"></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="12"></label>
      <label>Password again<input name="repeat" type="password" autocomplete="new-password" required minlength="12"></label>
      <label>Delete my account by itself
        <select name="autoDelete">
          <option value="2w">2 weeks after my last session</option>
          <option value="4w">4 weeks after my last session</option>
          <option value="3m">3 months after my last session</option>
          <option value="6m">6 months after my last session</option>
          <option value="1y">1 year after my last session</option>
          <option value="never" selected>Never</option>
        </select>
      </label>
      <p class="message" role="alert"></p>
      <button type="submit">Sign up</button>
    </form>
    <!-- From the settings: a new password (the password manager saves it) -->
    <form id="password-form" hidden>
      <h1>New password</h1>
      <input name="username" autocomplete="username" hidden>
      <label>Current password<input name="current" type="password" autocomplete="current-password" required></label>
      <label>New password<input name="password" type="password" autocomplete="new-password" required minlength="12"></label>
      <label>New password again<input name="repeat" type="password" autocomplete="new-password" required minlength="12"></label>
      <p class="hint">Your other logins end; this one stays.</p>
      <p class="message" role="alert"></p>
      <button type="submit">Change password</button>
      <button type="button" class="secondary">Cancel</button>
    </form>
  </div>
  <script>
    // Kotlin/Wasm needs WasmGC: Chrome/Edge 119+, Firefox 120+, Safari 18.2+ (iOS 18.2+)
    (function () {
      var ok = typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array([
        0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      if (!ok) {
        document.querySelector("#splash div:last-of-type").innerHTML =
          "<b>Your browser is too old for this page.</b><br>Please update it (iOS 18.2+, Chrome 119+, Firefox 120+).";
        document.querySelector("#splash .ring").remove();
        return;
      }
      var s = document.createElement("script");
      s.src = "webApp.js";
      document.body.appendChild(s);
    })();
    // Shown by the web app (Platform.showLogin) when the server answers 401: the login, or with an invitation's link
    // (#/invite/<token>) the sign-up. Platform.showPasswordChange opens the password form from the settings.
    window.randogeddonLogin = (function () {
      var root = document.getElementById("login");
      var forms = {
        login: document.getElementById("login-form"),
        signup: document.getElementById("signup-form"),
        password: document.getElementById("password-form")
      };
      var done = null;
      var token = null;
      // Compose keeps the pixel density it started with: after a browser zoom it would draw everything blurry. So the
      // page reloads once the zoom has settled (the login and the settings stay); behind the login form nothing of
      // Compose is visible, so there it waits for the login.
      var stale = false;
      var zoomTimer = null;
      (function watchZoom(ratio) {
        window.matchMedia("(resolution: " + ratio + "dppx)").addEventListener("change", function () {
          var now = window.devicePixelRatio;
          watchZoom(now);
          if (now === ratio) return;
          if (!root.hidden) { stale = true; return; }
          // Several zoom steps in a row reload once, after the last one
          clearTimeout(zoomTimer);
          zoomTimer = setTimeout(function () { location.reload(); }, 400);
        }, { once: true });
      })(window.devicePixelRatio);

      function open(name, text) {
        Object.keys(forms).forEach(function (key) { forms[key].hidden = key !== name; });
        forms[name].querySelector(".message").textContent = text || "";
        root.hidden = false;
      }
      function close(ok) {
        root.hidden = true;
        if (stale && ok) { location.reload(); return; }
        var callback = done;
        done = null;
        if (callback) callback(ok);
      }
      // Sends the form's JSON; on success calls onOk, otherwise shows why
      function send(form, method, path, body, onOk) {
        var button = form.querySelector("button[type=submit]");
        var message = form.querySelector(".message");
        button.disabled = true;
        message.textContent = "";
        fetch(path, { method: method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
          .then(function (r) {
            if (r.ok) { onOk(); return; }
            if (r.status === 429) { message.textContent = "Too many attempts. Please wait a minute."; return; }
            return r.json().then(function (e) { message.textContent = e.message; },
              function () { message.textContent = "That didn't work (" + r.status + ")."; });
          }, function () { message.textContent = "The server can't be reached."; })
          .finally(function () { button.disabled = false; });
      }
      function sameTwice(form) {
        if (form.password.value === form.repeat.value) return true;
        form.querySelector(".message").textContent = "The two passwords differ.";
        form.repeat.focus();
        return false;
      }
      // The hash goes back to the sessions (the token isn't needed any more, and shouldn't stay in the history)
      function leaveInvitation() {
        history.replaceState(null, "", location.pathname + location.search + "#/");
        window.dispatchEvent(new HashChangeEvent("hashchange"));
      }

      forms.login.addEventListener("submit", function (event) {
        event.preventDefault();
        var form = forms.login;
        send(form, "POST", "api/login", { username: form.username.value, password: form.password.value }, function () {
          form.password.value = "";
          close(true);
        });
      });
      forms.signup.addEventListener("submit", function (event) {
        event.preventDefault();
        var form = forms.signup;
        if (!sameTwice(form)) return;
        send(form, "POST", "api/signup", {
          token: token, name: form.username.value.trim(), password: form.password.value, autoDelete: form.autoDelete.value
        }, function () {
          form.password.value = form.repeat.value = "";
          token = null;
          leaveInvitation();
          close(true);
        });
      });
      forms.password.addEventListener("submit", function (event) {
        event.preventDefault();
        var form = forms.password;
        if (!sameTwice(form)) return;
        send(form, "PUT", "api/account/password", { current: form.current.value, password: form.password.value }, function () {
          form.current.value = form.password.value = form.repeat.value = "";
          close(true);
        });
      });
      forms.password.querySelector("button.secondary").addEventListener("click", function () { close(false); });

      function showSignup(invitation) {
        var form = forms.signup;
        token = invitation;
        fetch("api/invitations/" + encodeURIComponent(invitation)).then(function (r) { return r.json(); }).then(function (info) {
          if (!info.valid) {
            token = null;
            leaveInvitation();
            open("login", info.problem);
            forms.login.username.focus();
            return;
          }
          form.email.value = info.email || "";
          form.querySelector(".hint").textContent = "You're invited as " + info.email +
            ". Choose the name the others see, and your password.";
          if (!form.username.value) form.username.value = info.suggestedName || "";
          open("signup");
          (form.username.value ? form.password : form.username).focus();
        }, function () {
          open("login", "The server can't be reached.");
        });
      }
      return {
        show: function (text, onLoggedIn) {
          done = function (ok) { if (ok) onLoggedIn(); };
          var invitation = /^#\/invite\/([^/]+)/.exec(location.hash);
          if (invitation) { showSignup(decodeURIComponent(invitation[1])); return; }
          open("login", text);
          var form = forms.login;
          (form.username.value ? form.password : form.username).focus();
        },
        hide: function () { root.hidden = true; },
        password: function (name, onDone) {
          done = onDone;
          forms.password.username.value = name || "";
          open("password");
          forms.password.current.focus();
        }
      };
    })();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
