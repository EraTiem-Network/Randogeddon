<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Archipelago Tracker</title>
  <meta name="description" content="Live tracker for our Archipelago multiworld session">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f5f4fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
  <!-- iOS: "Add to Home Screen" opens it full screen with its own icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AP Tracker">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root { --bg: #f5f4fa; --text: #1b1a2b; --muted: #6c6a80; --accent: #7c5cff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #07070c; --text: #e9e8f2; --muted: #8d8ba3; --accent: #8e72ff; } }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: var(--muted); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
    #splash .ring { width: 44px; height: 44px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash b { color: var(--text); }
  </style>
</head>
<body>
  <div id="splash">
    <div class="ring"></div>
    <div><b>Archipelago Tracker</b><br>loading…</div>
    <noscript>This page needs JavaScript.</noscript>
  </div>
  <script>
    // Kotlin/Wasm needs WasmGC: Chrome/Edge 119+, Firefox 120+, Safari 18.2+ (iOS 18.2+)
    (function () {
      var ok = typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array([
        0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      if (!ok) {
        document.querySelector("#splash div:last-of-type").innerHTML =
          "<b>Your browser is too old for this page.</b><br>Please update it (iOS 18.2+, Chrome 119+, Firefox 120+).";
        document.querySelector("#splash .ring").remove();
        return;
      }
      var s = document.createElement("script");
      s.src = "webApp.js";
      document.body.appendChild(s);
    })();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
