# Overlay for the server when Traefik runs on another machine (e.g. on the Proxmox host, Randogeddon in a VM) and
# routes to this one through its file provider (see .docs/OPERATIONS.md): publish the ports, but keep the public addresses.
#   Traefik: https://${BASE_DOMAIN} → http://<this machine>:8000, <session-id>.${BASE_DOMAIN} → http://<this machine>:38281
services:
  gateway:
    ports:
      - "38281:38281"
    environment:
      # Game clients connect to <session-id>.<BASE_DOMAIN>
      BASE_DOMAIN: ${BASE_DOMAIN:-randogeddon.eratiem.net}

  tracker:
    ports:
      - "8000:8000"
    environment:
      # Shown to a session's players with their slot passwords ({id}: the session)
      PUBLIC_ADDRESS: "{id}.${BASE_DOMAIN:-randogeddon.eratiem.net}:443"
