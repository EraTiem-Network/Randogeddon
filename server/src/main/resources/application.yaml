randogeddon:
  tracker:
    # HTTP port of the dashboard and its API
    port: "$PORT:8000"
    # Title shown in the dashboard
    title: "$TRACKER_TITLE:Randogeddon"
    # The built web app (webApp's wasmJs distribution)
    webDir: "$WEB_DIR:webApp/build/dist/wasmJs/productionExecutable"
    # Randogeddon Bridge's builds, offered for download (randogeddon-bridge-<os>-<arch>[.exe] and VERSION)
    bridgeDir: "$BRIDGE_DIR:bridge/build/dist"
    # The tracker's files: each session's event history and, once finished, its archive (sessions/<id>/)
    stateDir: "$STATE_DIR:/state"
    # The gateway's data directory, read-only: each session's room.json (sessions/<id>/room.json)
    dataDir: "$DATA_DIR:/data"
    # Where game clients connect to a session ({id}: its ID), shown to its players with their slot passwords. Behind
    # Traefik: {id}.<BASE_DOMAIN>:443
    publicAddress: "$PUBLIC_ADDRESS:ws://localhost:38281/{id}"
    # A finished session is deleted this many days after it finished, unless an admin disabled its auto-deletion;
    # 0: never
    sessionRetentionDays: "$SESSION_RETENTION_DAYS:90"
    # The login cookie only over HTTPS (browsers make an exception for localhost). false only for a demo over plain
    # HTTP from other devices in the local network
    cookieSecure: "$COOKIE_SECURE:true"
    # Where the dashboard is reached, for the links in mails (invitations, address confirmations)
    publicUrl: "$PUBLIC_URL:http://localhost:8000"
    # Encrypts the two-factor (TOTP) secrets: base64 of 32 random bytes (openssl rand -base64 32); empty: a key file
    # totp.key in stateDir, made on the first start (it must stay with the database: without it, every two-factor
    # login has to be set up again)
    totpKey: "$TOTP_KEY:"
  mail:
    # The SMTP server for invitations and other mails; empty: mails are only written to the log (links included)
    host: "$MAIL_HOST:"
    # Connect here instead (an internal address); the certificate is still checked against host. Empty: host
    address: "$MAIL_ADDRESS:"
    port: "$MAIL_PORT:587"
    # starttls (587), tls (465), or none (a local test server only)
    security: "$MAIL_SECURITY:starttls"
    user: "$MAIL_USER:"
    password: "$MAIL_PASSWORD:"
    from: "$MAIL_FROM:randogeddon@example.net"
  oidc:
    # Administrators log in through this OpenID Connect provider (Authentik): its issuer, e.g.
    # https://auth.example.org/application/o/randogeddon/ ; empty: no single sign-on, Administrators log in with their
    # password and two-factor login
    issuer: "$OIDC_ISSUER:"
    clientId: "$OIDC_CLIENT_ID:"
    clientSecret: "$OIDC_CLIENT_SECRET:"
    # Who is an Administrator: the members of this group (the ID token's groups)
    adminGroup: "$OIDC_ADMIN_GROUP:randogeddon-administrators"
    # The bearer token of the provider's webhook when it deletes a person (POST /api/login/oidc/deleted): their account
    # here is deleted too. Empty: no webhook
    deletionToken: "$OIDC_DELETION_TOKEN:"
    # Where Administrators change their account (name, password, address, second factor); empty: Authentik's user
    # settings beside the issuer (<host>/if/user/)
    accountUrl: "$OIDC_ACCOUNT_URL:"
    # The login button says "Log in with <name>"
    name: "$OIDC_NAME:Authentik"
  server:
    # The gateway, which runs one MultiServer per session (on ports only the tracker reaches)
    gatewayHost: "$GATEWAY_HOST:localhost"
    # The gateway's internal API: the sessions' game servers (start, stop, console), generating seeds (admin panel)
    gameServerApi: "$GAME_SERVER_API:http://localhost:8001"
    # Shared with the gateway
    internalToken: "$INTERNAL_TOKEN:"
  database:
    # PostgreSQL: logins and slot passwords
    url: "$DB_URL:jdbc:postgresql://localhost:5432/randogeddon"
    user: "$DB_USER:randogeddon"
    password: "$DB_PASSWORD:"
