randogeddon:
  tracker:
    # HTTP port of the dashboard and its API
    port: "$PORT:8000"
    # Title shown in the dashboard
    title: "$TRACKER_TITLE:Randogeddon"
    # The built web app (webApp's wasmJs distribution)
    webDir: "$WEB_DIR:webApp/build/dist/wasmJs/productionExecutable"
    # Who plays which worlds (and the dashboard's grouping); optional, re-read when it changes
    sessionYaml: "$SESSION_YAML:/data/session.yaml"
    # Where the tracker keeps the event history, so it survives restarts
    statePath: "$STATE_PATH:/state/tracker.json"
    # Where game clients connect (the gateway), shown to logged-in players with their slot passwords
    publicAddress: "$AP_PUBLIC_ADDRESS:localhost:38281"
  server:
    # The Archipelago server, as seen from the tracker (inside compose: the archipelago service, which only the tracker
    # and the gateway reach)
    url: "$AP_SERVER:ws://localhost:38281"
    # Slot list written by the archipelago container on startup
    roomJson: "$ROOM_JSON:/data/room.json"
    # Connect with this slot first instead of the first one in roomJson
    bootstrapSlot: "$TRACKER_SLOT:"
    # The hint switches of the archipelago container (archipelago/serve.py), shown on the dashboard
    pointHints: "$AP_POINT_HINTS:true"
    autoHints: "$AP_AUTO_HINTS:true"
  database:
    # PostgreSQL: logins and slot passwords
    url: "$DB_URL:jdbc:postgresql://localhost:5432/randogeddon"
    user: "$DB_USER:randogeddon"
    password: "$DB_PASSWORD:"
