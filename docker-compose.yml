# Base stack. Combine with an overlay:
#   server (Traefik):  COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml   (set in .env)
#   local test:        COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
#
# The gateway is the game host: it runs one MultiServer per running session and is the game clients' only way in,
# checking the slot passwords. The dashboard (tracker) needs a login and controls the sessions' game servers through
# the gateway (admin panel). Both keep their data in PostgreSQL.
name: randogeddon

# Built from kotlin.Dockerfile: the native Kotlin apps (one Gradle build for both) and Archipelago for the gateway
x-build: &build
  context: .
  dockerfile: kotlin.Dockerfile
  secrets: [gradle_init]
  args:
    NATIVE_MARCH: ${NATIVE_MARCH:-x86-64-v3}
    AP_VERSION: ${AP_VERSION:-0.6.8}

x-database: &database
  DB_URL: jdbc:postgresql://postgres:5432/randogeddon
  DB_USER: randogeddon
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

# Between tracker and gateway (the admin panel's control of the game servers)
x-internal-token: &internal-token ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: randogeddon
      POSTGRES_USER: randogeddon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "randogeddon", "-d", "randogeddon"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    # Locally as built; on the server from the registry (GATEWAY_IMAGE, GATEWAY_TAG set by scripts/deploy.sh)
    image: ${GATEWAY_IMAGE:-randogeddon-gateway}:${GATEWAY_TAG:-${AP_VERSION:-0.6.8}}
    build:
      <<: *build
      target: gateway
    restart: unless-stopped
    # MultiServer saves on /exit when the gateway stops; give it the time
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      INTERNAL_TOKEN: *internal-token
      AP_ADMIN_PASSWORD: ${AP_ADMIN_PASSWORD:-}
      # One MultiServer per running session, each on one of these ports (inside compose only): as many run at once
      AP_PORTS: ${AP_PORTS:-38300-38303}
      # Without a domain, game clients name their session by the path (ws://host:38281/<id>); the Traefik overlay sets
      # it, for <id>.<BASE_DOMAIN>
      BASE_DOMAIN: ""
    volumes:
      - ./data:/data                  # sessions/<id>/ (seed, save, room.json), old/, uploaded apworlds
      - ./custom_worlds:/custom_worlds:ro   # apworlds put here by hand, for every release

  tracker:
    image: ${TRACKER_IMAGE:-randogeddon-tracker}:${IMAGE_TAG:-latest}
    build:
      <<: *build
      target: tracker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      <<: *database
      # The gateway runs the sessions' MultiServers; their ports are not published, only the tracker connects there
      GATEWAY_HOST: gateway
      GAME_SERVER_API: http://gateway:8001
      INTERNAL_TOKEN: *internal-token
      # Shown to a session's players ({id}: the session); the Traefik overlay sets the public host names
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-ws://localhost:38281/{id}}
      TRACKER_TITLE: ${TRACKER_TITLE:-Randogeddon}
      # Past sessions are deleted this many days after they finished (unless kept); 0: never
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-90}
      # The login cookie only over HTTPS; the local overlay can switch that off (see there)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Where the dashboard is reached, for the links in mails
      PUBLIC_URL: ${PUBLIC_URL:-https://${BASE_DOMAIN:-randogeddon.eratiem.net}}
      # The mails (invitations, address confirmations, deletion warnings); without MAIL_HOST only in the log
      MAIL_HOST: ${MAIL_HOST:-}
      # Connect to this address instead of MAIL_HOST's, still checking the certificate against MAIL_HOST: from a VM
      # behind the same host as the mail server, its public address leads back to the host
      MAIL_ADDRESS: ${MAIL_ADDRESS:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURITY: ${MAIL_SECURITY:-starttls}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-randogeddon@example.net}
      # Encrypts the two-factor secrets; empty: a key file in the tracker-state volume, made on the first start
      TOTP_KEY: ${TOTP_KEY:-}
      # Administrators log in through this OpenID Connect provider (Authentik); without OIDC_ISSUER with their password
      # and two-factor login
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-randogeddon-administrators}
      OIDC_DELETION_TOKEN: ${OIDC_DELETION_TOKEN:-}
      OIDC_NAME: ${OIDC_NAME:-Authentik}
    volumes:
      - ./data:/data:ro              # reads each session's room.json, written by the gateway
      - tracker-state:/state         # each session's event history and archive survive restarts

volumes:
  tracker-state:
  postgres-data:

secrets:
  # Gradle init script with the token for pkg.example.org (entry `example`); only needed when the images are built
  gradle_init:
    file: ${GRADLE_INIT_SCRIPT:-${HOME}/.gradle/init.gradle.kts}
