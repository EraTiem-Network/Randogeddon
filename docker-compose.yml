# Base stack. Combine with an overlay:
#   server (Traefik):  COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml   (set in .env)
#   local test:        COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
#
# The gateway is the game host: it runs one MultiServer per running session and is the game clients' only way in,
# checking the slot passwords. The dashboard (tracker) needs a login and controls the sessions' game servers through
# the gateway (admin panel). Both keep their data in PostgreSQL.
name: randogeddon

# Built from kotlin.Dockerfile: the native Kotlin apps (one Gradle build for both) and Archipelago for the gateway
x-build: &build
  context: .
  dockerfile: kotlin.Dockerfile
  secrets: [gradle_init, bridge_signing_key]
  # One plain linux/amd64 image: without these, BuildKit adds attestations and the image becomes an index (a registry
  # shows it as multi-arch, with an `unknown/unknown` entry)
  provenance: false
  sbom: false
  args:
    NATIVE_MARCH: ${NATIVE_MARCH:-x86-64-v3}
    # native-image's heap while it builds, and its optimisation (empty: by the version; the demo builds `quick`)
    NATIVE_MAX_HEAP: ${NATIVE_MAX_HEAP:-6g}
    NATIVE_OPTIMIZATION: ${NATIVE_OPTIMIZATION:-}
    AP_VERSION: ${AP_VERSION:-0.6.8}
    # The commit of that release's tag (git ls-remote https://github.com/ArchipelagoMW/Archipelago refs/tags/<version>):
    # the build stops if the tag has moved
    AP_COMMIT: ${AP_COMMIT:-54803be064fc7e80c4628777ed0b46a9390f255f}
    # Randogeddon Bridge's version: the project's (deploy.sh sets it)
    BRIDGE_VERSION: ${BRIDGE_VERSION:-dev}
    # The signing key's public half (deploy.sh sets it): the signing step's cache then goes by the key, so a build
    # without one is never taken for one with it
    BRIDGE_SIGNING_KEY_ID: ${BRIDGE_SIGNING_KEY_ID:-}
    # A Maven mirror for the Gradle build (see settings.gradle.kts); empty: Maven Central, the plugin portal, Google
    RANDOGEDDON_MAVEN: ${RANDOGEDDON_MAVEN:-}
    RANDOGEDDON_MAVEN_NAME: ${RANDOGEDDON_MAVEN_NAME:-}

# The programs' database logins: a role of its own each, never the database's superuser. database-roles makes both
# before the tracker starts, the tracker gives the gateway's its rights. Each value is written once, here, and used by
# whoever makes the role and whoever logs in with it. Without TRACKER_DB_PASSWORD / GATEWAY_DB_PASSWORD a password is
# derived from a secret the program holds anyway: the tracker's from POSTGRES_PASSWORD (the superuser can't log in
# from the tracker's container, see pg_hba below), the gateway's from INTERNAL_TOKEN, so that nothing in the gateway's
# environment leads to the tracker's or the superuser's password
x-tracker-db-user: &tracker-db-user ${TRACKER_DB_USER:-randogeddon_tracker}
x-tracker-db-password: &tracker-db-password ${TRACKER_DB_PASSWORD:-${POSTGRES_PASSWORD}-tracker}
x-gateway-db-user: &gateway-db-user ${GATEWAY_DB_USER:-randogeddon_gateway}
x-gateway-db-password: &gateway-db-password ${GATEWAY_DB_PASSWORD:-${INTERNAL_TOKEN}-gateway}

# The tracker's database login
x-database: &database
  DB_URL: jdbc:postgresql://postgres:5432/randogeddon
  DB_USER: *tracker-db-user
  DB_PASSWORD: *tracker-db-password

# Between tracker and gateway (the admin panel's control of the game servers)
x-internal-token: &internal-token ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}

# The containers' logs stay small: Docker keeps the newest 5 files of 10 MB each (without this they grow until the
# disk is full)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    logging: *logging
    # A runaway query or a flood of connections ends here, not with the VM's memory (each connection is a process)
    mem_limit: ${POSTGRES_MEMORY:-1g}
    pids_limit: 512
    # The image's start runs as root only to give its data folder and socket folder to the postgres user (chown, and
    # chmod and find in folders that are postgres' already), then becomes that user: these capabilities and no other
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # Who may log in from where: pg_hba (below) in place of the one the image writes into the data folder
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    configs:
      - source: pg_hba
        target: /etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: randogeddon
      POSTGRES_USER: randogeddon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    # Only on the database's network: the tracker and the gateway reach it, the minecraft service and the rest can't
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "randogeddon", "-d", "randogeddon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The programs' database roles, made (or brought back to their rights) by the database's superuser before the
  # tracker starts: the tracker's owns the tables (it migrates them) and may change the gateway's, but neither is a
  # superuser, which could run programs in the database's container. So the superuser's password stays with this
  # one-off service and the dumps. A setting that names the superuser for either, or one role for both, is refused here
  # (the tracker then doesn't start)
  database-roles:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: "no"
    logging: *logging
    user: postgres
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    # In the database's own container's network (so on the database's network too): the only place the superuser may
    # log in from over the network (pg_hba)
    network_mode: service:postgres
    environment:
      PGHOST: 127.0.0.1
      PGDATABASE: randogeddon
      PGUSER: randogeddon
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TRACKER_DB_USER: *tracker-db-user
      TRACKER_DB_PASSWORD: *tracker-db-password
      GATEWAY_DB_USER: *gateway-db-user
    configs:
      - source: database_roles
        target: /database-roles.sql
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -X -q -v ON_ERROR_STOP=1 -f /database-roles.sql && echo "The database roles $$TRACKER_DB_USER (the tracker's) and $$GATEWAY_DB_USER (the gateway's) are there"

  gateway:
    # Locally as built; on the server from the registry (GATEWAY_IMAGE, GATEWAY_TAG set by scripts/deploy.sh)
    image: ${GATEWAY_IMAGE:-randogeddon-gateway}:${GATEWAY_TAG:-${AP_VERSION:-0.6.8}}
    build:
      <<: *build
      target: gateway
    restart: unless-stopped
    logging: *logging
    # Docker's init (tini) is process 1: it collects what Archipelago's processes leave (a world's patcher whose
    # Python was ended) and passes docker stop's SIGTERM on to the gateway alone, which then has every MultiServer save
    # (/exit) before it ends; its processes aren't signalled by anyone else
    init: true
    # MultiServer saves on /exit when the gateway stops; give it the time
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      database-roles:
        condition: service_completed_successfully
    # The project's network (the tracker, the minecraft service, game clients through Traefik) and the database's
    networks: [default, database]
    # Generate.py and the game servers share this container: a seed too large for it ends there, not the VM. Full, the
    # kernel ends a generation or a logic first, then a game server, the gateway last (their out-of-memory scores)
    mem_limit: ${GATEWAY_MEMORY:-5g}
    pids_limit: 4096
    # Its start (gateway/docker-entrypoint.sh) runs as root with only these three capabilities and at once becomes the
    # gateway's own user, keeping just them: to start Archipelago's Python (third-party APWorld code) as a user of its
    # own without any capability, which can't read the gateway's environment or memory, and to end and pause those
    # processes. Nothing gains a privilege through an executable (no-new-privileges)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    # Healthy once it takes game clients' connections (no curl in the image: a plain TCP connection through bash). It
    # waits for its database login from the tracker first; nothing restarts it for being unhealthy, docker ps shows it
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/38281"]
      interval: 30s
      timeout: 5s
      start_period: 120s
    environment:
      # Its own database role with only its rights (database-roles makes it, the tracker gives it its password and
      # rights at each start; until then the gateway waits). Archipelago's Python runs here, as another user that can't
      # read this environment; even the gateway has neither the tracker's password nor the superuser's
      DB_URL: jdbc:postgresql://postgres:5432/randogeddon
      DB_USER: *gateway-db-user
      DB_PASSWORD: *gateway-db-password
      INTERNAL_TOKEN: *internal-token
      # Whose X-Forwarded-For counts for a game client's address (its limit per address), as the tracker's; empty:
      # every peer's (the proxy and the Traefik overlays require it)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # How long a generation may take before it is stopped (minutes)
      GENERATION_MINUTES: ${GENERATION_MINUTES:-60}
      GENERATIONS_AT_ONCE: ${GENERATIONS_AT_ONCE:-0}
      # The minecraft service (the Minecraft Dig slots' servers)
      MINECRAFT_API: http://minecraft:8002
      # Between the gateway and the minecraft service only (never INTERNAL_TOKEN); without it no Minecraft server is
      # hosted, and the gateway's log and the admin panel say so
      MINECRAFT_TOKEN: ${MINECRAFT_TOKEN:-}
      # true: the operator accepts Mojang's EULA (https://aka.ms/MinecraftEULA) for every hosted Minecraft server;
      # without it none runs
      MINECRAFT_EULA: ${MINECRAFT_EULA:-false}
      # Without a domain, game clients name their session by the path (ws://host:38281/<id>); the Traefik overlay sets
      # it, for <id>.<BASE_DOMAIN>
      BASE_DOMAIN: ""
    volumes:
      # sessions/<id>/ (seed, save, room.json), old/, uploaded apworlds; uid 1000's (the gateway's) on the host. The
      # gateway gives Archipelago's user (uid and group 1100) what it needs of it at each start, the rest it closes
      - ./data:/data
      - ./custom_worlds:/custom_worlds:ro   # apworlds put here by hand, for every release

  minecraft:
    # The hosted Minecraft servers of Minecraft Dig slots: an image of their own (Java 17, Forge with the mod,
    # minecraft_host.py), tagged like the tracker's; they run on the gateway's orders. Nothing of it is published: the
    # gateway passes the players' connections on to it
    image: ${MINECRAFT_IMAGE:-randogeddon-minecraft}:${IMAGE_TAG:-latest}
    build:
      <<: *build
      target: minecraft
    restart: unless-stopped
    logging: *logging
    # Docker's init (tini) is process 1: it collects ended servers' leftovers and passes docker stop's SIGTERM on to
    # minecraft_host.py alone, which has every server save its world first
    init: true
    # Each server saves its world on `stop`
    stop_grace_period: 60s
    # The service's memory in all: each server at most 3 GB (its heap 2 GB; a watchdog ends one above that), and
    # MINECRAFT_SERVERS of them at once must fit in it (two: about 6500m)
    mem_limit: ${MINECRAFT_MEMORY:-3500m}
    # The Java servers' user has at most 1536 of them (java-as-server), the rest is minecraft_host.py's
    pids_limit: 2048
    # Its start (gateway/minecraft-entrypoint.sh) runs as root with only these three capabilities and at once becomes
    # uid 1000 (the data folder's owner), keeping just them: to start each server's Java as a user of its own (uid 1200)
    # without any capability, which can't read minecraft_host.py's environment (the token) or signal it, and to end
    # those servers. Nothing gains a privilege through an executable (no-new-privileges)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    # Healthy once minecraft_host.py's API takes connections (a plain TCP connection, with the image's Python)
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8002), 3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    environment:
      # Its own token (the gateway's INTERNAL_TOKEN stays with the gateway and the tracker): the servers run
      # third-party mod code as another user, which can't read it; with the token comes no more than this service's API
      MINECRAFT_TOKEN: ${MINECRAFT_TOKEN:-}
      MINECRAFT_SERVERS: ${MINECRAFT_SERVERS:-1}
      MINECRAFT_HEAP: 2G
      MINECRAFT_LIMIT_MB: 3072
      GATEWAY_WS: gateway:38281
      # servers/<session>-p<slot>/, each server's world and its notes; the seed's patch comes in the gateway's request
      DATA: /data/minecraft
    volumes:
      # Its own folder (uid 1000's), beside the data folder, not in it: the gateway can write the data folder, so it
      # could put a link to anywhere on the host in a folder there that this service mounts. None of the sessions' files
      - ./minecraft:/data/minecraft

  tracker:
    image: ${TRACKER_IMAGE:-randogeddon-tracker}:${IMAGE_TAG:-latest}
    build:
      <<: *build
      target: tracker
    restart: unless-stopped
    logging: *logging
    mem_limit: ${TRACKER_MEMORY:-2g}
    pids_limit: 1024
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # It writes only its state volume (and reads the data folder): the image itself stays as built. /tmp for whatever
    # the native image or its libraries put there (Docker's defaults: no executables, no set-user-ID)
    read_only: true
    tmpfs:
      - /tmp:size=64m
    depends_on:
      postgres:
        condition: service_healthy
      database-roles:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    # The project's network (the gateway, Traefik's overlay, the local overlay's mailpit) and the database's
    networks: [default, database]
    environment:
      <<: *database
      # The gateway runs the sessions' MultiServers; their ports are not published, only the tracker connects there
      GATEWAY_HOST: gateway
      GAME_SERVER_API: http://gateway:8001
      INTERNAL_TOKEN: *internal-token
      # The gateway's own database role: given its password and only the gateway's rights here, at each start
      GATEWAY_DB_USER: *gateway-db-user
      GATEWAY_DB_PASSWORD: *gateway-db-password
      # Shown to a session's players ({id}: the session); the Traefik overlay sets the public host names
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-ws://localhost:38281/{id}}
      TRACKER_TITLE: ${TRACKER_TITLE:-Randogeddon}
      # Past sessions are deleted this many days after they finished (unless kept); 0: never
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-90}
      # The login cookie only over HTTPS; the local overlay can switch that off (see there)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Where the dashboard is reached, for the links in mails (the server overlays require BASE_DOMAIN)
      PUBLIC_URL: ${PUBLIC_URL:-https://${BASE_DOMAIN:-localhost}}
      # Whose X-Forwarded-For counts for the client's address (the rate limits); empty: every peer's (the proxy and
      # the Traefik overlays require it)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # The mails (invitations, address confirmations, deletion warnings); without MAIL_HOST only in the log
      MAIL_HOST: ${MAIL_HOST:-}
      # Connect to this address instead of MAIL_HOST's, still checking the certificate against MAIL_HOST: from a VM
      # behind the same host as the mail server, its public address leads back to the host
      MAIL_ADDRESS: ${MAIL_ADDRESS:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURITY: ${MAIL_SECURITY:-starttls}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Encrypts the two-factor secrets; empty: a key file in the tracker-state volume, made on the first start
      TOTP_KEY: ${TOTP_KEY:-}
      # Administrators log in through this OpenID Connect provider (Authentik); without OIDC_ISSUER no login acts as one,
      # unless ADMIN_PASSWORD_LOGIN
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-randogeddon-administrators}
      OIDC_DELETION_TOKEN: ${OIDC_DELETION_TOKEN:-}
      OIDC_ACCOUNT_URL: ${OIDC_ACCOUNT_URL:-}
      OIDC_NAME: ${OIDC_NAME:-Authentik}
      # Without single sign-on: Administrators with their password and two-factor login. Local testing and the demo
      # only (the local overlay sets it), never a public server
      ADMIN_PASSWORD_LOGIN: ${ADMIN_PASSWORD_LOGIN:-false}
    volumes:
      - ./data:/data:ro              # reads each session's room.json, written by the gateway
      - tracker-state:/state         # the TOTP key file (without TOTP_KEY); session files of before 0.19.10, imported once

volumes:
  tracker-state:
  postgres-data:

networks:
  # The database's own: postgres, the tracker and the gateway (database-roles in postgres' container), with no way out
  # of the host. Everything else (the minecraft service, the local overlay's mailpit, the demo's helpers) stays on the
  # project's default network (randogeddon_default) with the tracker and the gateway
  database:
    internal: true

configs:
  # Who may log in to PostgreSQL, and from where (the first line that fits decides). Over the socket (docker compose
  # exec postgres: the dumps, the deploy's check, a restore) without a password, as the image has it; the superuser over
  # the network only from inside the database's own container (database-roles shares it), so its password is of no use
  # from the tracker's or the gateway's container or anywhere else; every other role with its password
  pg_hba:
    content: |
      local all all                      trust
      host  all randogeddon 127.0.0.1/32 scram-sha-256
      host  all randogeddon ::1/128      scram-sha-256
      host  all randogeddon all          reject
      host  all all         all          scram-sha-256

  # What database-roles runs (psql, as the superuser). Every statement is made from the names with format(), so a
  # name or a password is never part of the script's text
  database_roles:
    content: |
      -- A statement that fails isn't written into the database's log (two of them hold the tracker's password), and
      -- psql's errors show no statement either
      SET log_min_error_statement = panic;
      \set VERBOSITY terse
      \getenv tracker TRACKER_DB_USER
      \getenv password TRACKER_DB_PASSWORD
      \getenv gateway GATEWAY_DB_USER
      -- Two roles of their own, neither a superuser: a setting that names the superuser, or one role for both, is
      -- refused before anything is changed
      SELECT :'tracker' = current_user AS tracker_super, :'gateway' IN (current_user, :'tracker') AS gateway_taken,
        EXISTS (SELECT FROM pg_roles WHERE rolname = :'gateway' AND rolsuper) AS gateway_super \gset
      \if :tracker_super
        DO 'BEGIN RAISE EXCEPTION ''TRACKER_DB_USER names the superuser of the database: the tracker needs a role of its own''; END';
      \endif
      \if :gateway_taken
        DO 'BEGIN RAISE EXCEPTION ''GATEWAY_DB_USER names the superuser or the tracker: the gateway needs a role of its own''; END';
      \endif
      \if :gateway_super
        DO 'BEGIN RAISE EXCEPTION ''GATEWAY_DB_USER names a superuser: the gateway needs a role of its own''; END';
      \endif
      SELECT format('CREATE ROLE %I', :'tracker') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'tracker') \gexec
      SELECT format('ALTER ROLE %I LOGIN NOSUPERUSER NOCREATEDB CREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'tracker', :'password') \gexec
      -- Everything of the schema is the tracker's (it migrates it); what a table owns (its sequences) goes with it
      SELECT format('ALTER SCHEMA public OWNER TO %I', :'tracker') \gexec
      SELECT format('ALTER TABLE public.%I OWNER TO %I', c.relname, :'tracker') FROM pg_class c
        WHERE c.relnamespace = 'public'::regnamespace AND c.relkind IN ('r', 'p', 'v', 'm') AND c.relowner <> :'tracker'::regrole \gexec
      SELECT format('ALTER SEQUENCE public.%I OWNER TO %I', c.relname, :'tracker') FROM pg_class c
        WHERE c.relnamespace = 'public'::regnamespace AND c.relkind = 'S' AND c.relowner <> :'tracker'::regrole
          AND NOT EXISTS (SELECT FROM pg_depend d WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid AND d.deptype IN ('a', 'i')) \gexec
      SELECT format('ALTER TYPE public.%I OWNER TO %I', t.typname, :'tracker') FROM pg_type t
        WHERE t.typnamespace = 'public'::regnamespace AND t.typtype IN ('e', 'd') AND t.typowner <> :'tracker'::regrole \gexec
      SELECT format('ALTER ROUTINE %s OWNER TO %I', p.oid::regprocedure, :'tracker') FROM pg_proc p
        WHERE p.pronamespace = 'public'::regnamespace AND p.proowner <> :'tracker'::regrole \gexec
      -- The gateway's role: made here if it isn't there (without a login until the tracker gives it its password and
      -- rights at its start), no more than a login if the superuser made it before, and the tracker's to change
      SELECT format('CREATE ROLE %I', :'gateway') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'gateway') \gexec
      SELECT format('ALTER ROLE %I NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', :'gateway') \gexec
      SELECT format('GRANT %I TO %I WITH ADMIN TRUE, INHERIT FALSE, SET FALSE', :'gateway', :'tracker') \gexec

secrets:
  # Gradle init script with the login for the Maven mirror (RANDOGEDDON_MAVEN); only read when the images are built.
  # The file must exist: without a mirror, GRADLE_INIT_SCRIPT=/dev/null
  gradle_init:
    file: ${GRADLE_INIT_SCRIPT:-${HOME}/.gradle/init.gradle.kts}
  # The SSH key the bridge's checksums are signed with (scripts/deploy.sh names it); without one they aren't signed
  bridge_signing_key:
    file: ${BRIDGE_SIGNING_KEY:-/dev/null}
