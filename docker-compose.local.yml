# Overlay for local testing / no reverse proxy: publish the ports directly.
#   game server: localhost:38281    dashboard: http://localhost:8000    mails: http://localhost:8025 (Mailpit)
services:
  # Game clients connect to the gateway; MultiServer itself is not published
  gateway:
    ports:
      - "38281:38281"
  tracker:
    ports:
      - "8000:8000"
    environment:
      # Plain HTTP: without this, browsers on other devices (http://<pc-ip>:8000) drop the login cookie. Browsers
      # accept it over HTTP on localhost anyway; behind Traefik (HTTPS) it stays secure
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The mails (invitations, …) go to Mailpit instead of out: see them at http://localhost:8025
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SECURITY: none
      PUBLIC_URL: http://localhost:8000
      # No single sign-on here: Administrators log in with their password and two-factor login (the demo's Alice)
      ADMIN_PASSWORD_LOGIN: ${ADMIN_PASSWORD_LOGIN:-true}

  # Catches every mail the tracker sends, with a web UI to read them
  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "8025:8025"
