# Overlay for local testing / no reverse proxy: publish the ports directly.
#   game server: localhost:38281    dashboard: http://localhost:8000
services:
  # Game clients connect to the gateway; MultiServer itself is not published
  gateway:
    ports:
      - "38281:38281"
  tracker:
    ports:
      - "8000:8000"
    environment:
      # Plain HTTP: without this, browsers on other devices (http://<pc-ip>:8000) drop the login cookie. Browsers
      # accept it over HTTP on localhost anyway; behind Traefik (HTTPS) it stays secure
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
