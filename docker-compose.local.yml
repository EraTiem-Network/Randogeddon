# Overlay for local testing only (the demo), never a reachable server: the ports published on this machine's loopback
# address alone, so nothing else in the network reaches the dashboard, the game servers or the mails.
#   game server: localhost:38281    dashboard: http://localhost:8000    mails: http://localhost:8025 (Mailpit)
services:
  # Game clients connect to the gateway; MultiServer itself is not published
  gateway:
    ports:
      - "127.0.0.1:38281:38281"
  tracker:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Plain HTTP: browsers accept the login cookie over HTTP on localhost anyway; behind Traefik (HTTPS) it stays secure
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The mails (invitations, …) go to Mailpit instead of out: see them at http://localhost:8025
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SECURITY: none
      PUBLIC_URL: http://localhost:8000
      # No single sign-on here: Administrators log in with their password and two-factor login (the demo's Alice)
      ADMIN_PASSWORD_LOGIN: ${ADMIN_PASSWORD_LOGIN:-true}

  # Catches every mail the tracker sends, with a web UI to read them (no login: every invitation's link is there, so
  # only on this machine)
  mailpit:
    image: axllent/mailpit:v1.21.8@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    restart: unless-stopped
    # As the base file's x-logging (an anchor isn't seen from another file)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 256m
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:8025:8025"
